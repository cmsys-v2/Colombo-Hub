name: colombo_hub
description: "ColomboHub Super-App for Corporate & Daily Commuters"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Firebase Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_remote_config: ^5.1.3
  # Maps, Location & Geofencing
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.9
  geolocator: ^13.0.1
  geoflutterfire_plus: ^0.0.24
  # UI/UX & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
